name: Jana senarai game

on:
  push:
    branches: [main]
    paths-ignore: ['games.json']

permissions:
  contents: write

concurrency:
  group: jana-games
  cancel-in-progress: false

jobs:
  jana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Imbas fail HTML
        run: |
          python3 - <<'EOF'
          import os, re, json, html
          KECUALI = {"index.html"}
          hasil = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if not d.startswith((".", "_"))]
              for f in files:
                  if not f.endswith(".html") or f in KECUALI and root == ".":
                      continue
                  p = os.path.join(root, f)[2:].replace("\\", "/")
                  txt = open(p, encoding="utf-8", errors="ignore").read()
                  m = re.search(r"<title>(.*?)</title>", txt, re.S | re.I)
                  tajuk = html.unescape(m.group(1).strip()) if m and m.group(1).strip() else f[:-5].replace("-", " ").title()
                  t = re.search(r'<meta\s+name=["\']tahun["\']\s+content=["\'](.*?)["\']', txt, re.I)
                  tahun = t.group(1).strip() if t else ""
                  if not tahun:
                      fm = re.search(r"(tahun|tingkatan|tahap)[\s_-]*(\d+)", os.path.dirname(p), re.I)
                      if fm:
                          tahun = fm.group(1).capitalize() + " " + fm.group(2)
                  if not tahun:
                      tahun = "Lain-lain"
                  hasil.append({"title": tajuk, "path": p, "tahun": tahun})

          def kunci(x):
              m = re.search(r"(\d+)", x["tahun"])
              lain = x["tahun"] == "Lain-lain"
              return (lain, "" if lain else x["tahun"].split()[0].lower(),
                      int(m.group(1)) if m else 0, x["title"].lower())
          hasil.sort(key=kunci)
          json.dump(hasil, open("games.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          EOF

      - name: Simpan games.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add games.json
          if ! git diff --cached --quiet; then
            git commit -m "Kemas kini senarai game"
            git pull --rebase
            git push
          fi
