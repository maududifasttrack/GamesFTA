<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Makmal Matematik</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(135deg,#e0f2fe,#fef3c7);min-height:100vh;padding:24px}
  h1{text-align:center;margin:0 0 16px;color:#1e3a8a}
  #cari{display:block;margin:0 auto 24px;width:min(420px,100%);padding:12px 16px;font-size:16px;border:2px solid #93c5fd;border-radius:999px;outline:none}
  .grid{max-width:1000px;margin:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
  .kad{display:flex;align-items:center;justify-content:center;text-align:center;min-height:110px;padding:16px;border-radius:18px;color:#fff;font-weight:700;font-size:18px;text-decoration:none;box-shadow:0 4px 12px rgba(0,0,0,.15);transition:transform .15s}
  .kad:hover{transform:translateY(-4px) scale(1.03)}
  #info{text-align:center;color:#475569}
</style>
</head>
<body>
<h1>🎮 Makmal Matematik</h1>
<input id="cari" type="search" placeholder="Cari game...">
<div class="grid" id="grid"></div>
<p id="info"></p>

<script>
const warna = ["#ef4444","#f97316","#eab308","#22c55e","#14b8a6","#3b82f6","#8b5cf6","#ec4899"];
let games = [];

function papar(senarai){
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  senarai.forEach((g,i)=>{
    const a = document.createElement("a");
    a.className = "kad";
    a.href = encodeURI(g.path);
    a.textContent = g.title;
    a.style.background = warna[i % warna.length];
    grid.appendChild(a);
  });
  document.getElementById("info").textContent = senarai.length ? "" : "Tiada game dijumpai.";
}

fetch("games.json?v=" + Date.now())
  .then(r => r.json())
  .then(d => { games = d; papar(games); })
  .catch(() => { document.getElementById("info").textContent = "Senarai game belum dijana."; });

document.getElementById("cari").addEventListener("input", e=>{
  const q = e.target.value.toLowerCase();
  papar(games.filter(g => g.title.toLowerCase().includes(q)));
});
</script>
</body>
</html>
