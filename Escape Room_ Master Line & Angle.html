.c{text-align:center}
.wl{text-align:center;padding:14px 0 30px}.neon{display:inline-block;border:2px solid #4ade80;color:#4ade80;padding:5px 14px;border-radius:6px;text-shadow:0 0 8px #4ade80;box-shadow:0 0 14px #4ade8066,inset 0 0 10px #4ade8033;font:700 13px/1 "Courier New",monospace;letter-spacing:3px;animation:gl 1.6s infinite alternate}.ttl{font-size:clamp(34px,9vw,62px);line-height:1.05;letter-spacing:3px;margin:16px 0 8px;color:#ffe9b0;text-shadow:0 0 10px #f59e0b,0 0 32px #d97706,0 4px 8px #000;animation:gl 2.2s infinite alternate}.door{width:min(210px,55vw);margin:16px auto;display:block;filter:drop-shadow(0 0 28px #f59e0b77)}.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}.chip{background:#000b;border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:13px}.go{font-size:21px;padding:14px 36px;animation:pu 1.4s infinite}.lk{animation:gl 1s infinite alternate}@keyframes pu{50%{transform:scale(1.06);box-shadow:0 3px 0 #7c4a03,0 0 24px #f59e0b}}@keyframes gl{from{opacity:.8}to{opacity:1}}.en{font-style:italic;color:var(--mu);font-size:14px;margin-top:2px;font-weight:400}.f{flex-wrap:wrap}.f label{min-width:130px}button i{font-weight:400}.ov{position:fixed;inset:0;z-index:50;display:flex}.cdo{background:#000e;flex-direction:column;align-items:center;justify-content:center;text-align:center}.cd{font-size:min(40vw,170px);font-weight:700;color:#ffe9b0;text-shadow:0 0 30px #f59e0b;animation:zm .95s}@keyframes zm{from{transform:scale(2.2);opacity:0}30%{opacity:1}to{transform:scale(1)}}.sb{color:var(--mu);font-size:16px;font-weight:400}.dl,.dr{width:50%;height:100%;background:linear-gradient(90deg,#4a525e,#8a94a3 45%,#4a525e);border:5px solid #1c1c1c;box-shadow:inset 0 0 50px #000b;transition:transform 1.2s cubic-bezier(.7,0,.3,1)}.open .dl{transform:translateX(-101%)}.open .dr{transform:translateX(101%)}.dt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font:700 26px Georgia,serif;text-align:center;text-shadow:0 2px 8px #000;transition:opacity .4s}.open .dt{opacity:0}.lc{font-size:72px}#mt{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:60;padding:6px 10px;font-size:18px}.hm{position:fixed;inset:0;z-index:55;background:#000d;overflow:auto;padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px))}.hp2{max-width:720px;margin:0 auto}.fm{font:700 24px Georgia,serif;color:var(--gr);margin-top:6px}#hp{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:58px;z-index:60;padding:6px 10px;font-size:15px}.w{padding-top:54px}#bg{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:192px;z-index:60;padding:6px 10px;font-size:15px}.bagv{font:700 18px "Courier New",monospace;color:var(--gr);margin-bottom:4px}.bagg{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:10px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;background:#052e16;border:2px solid var(--gr);color:#fff;padding:10px 18px;border-radius:10px;animation:tf 2.2s forwards}@keyframes tf{0%{opacity:0;transform:translate(-50%,20px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}.sc{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;background:radial-gradient(circle,#7f1d1d99,#000d);animation:sf 1.7s forwards}.se{font-size:min(38vw,220px);animation:pp .5s,sk .12s 4 .5s;filter:drop-shadow(0 0 30px #ef4444)}.st{font:700 26px Georgia,serif;text-shadow:0 2px 8px #000;text-align:center}@keyframes pp{from{transform:scale(.2) rotate(-15deg)}70%{transform:scale(1.25)}to{transform:scale(1)}}@keyframes sk{50%{transform:translateX(12px) rotate(4deg)}}@keyframes sf{0%,75%{opacity:1}100%{opacity:0}}@media(min-width:1000px){.w{max-width:1240px;padding:54px 28px 14px}.qs{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;align-items:start}.wl{display:grid;grid-template-columns:1.15fr 1fr;gap:10px 40px;align-items:center;min-height:calc(100vh - 90px);padding:0}.wl1{text-align:left}.wl2{text-align:center}.wl .ttl{margin:14px 0 8px}.wl .chips{justify-content:flex-start}.wl .door{width:min(240px,34vh)}}.cl{position:fixed;inset:0;z-index:70;background:radial-gradient(circle,#3b2a08ee,#000f);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:10px;animation:fi .5s}@keyframes fi{from{opacity:0}}.mk{font-size:90px;filter:drop-shadow(0 0 30px #fbbf24);animation:bn 1s infinite alternate}@keyframes bn{to{transform:translateY(-12px) scale(1.08)}}.keyz{display:flex;gap:12px;font-size:42px}.keyz span{opacity:0;animation:kp .5s forwards}@keyframes kp{from{opacity:0;transform:translateY(-40px) scale(.3)}to{opacity:1;transform:none}}.cf{position:fixed;top:-30px;z-index:90;pointer-events:none;animation:cfl linear forwards}@keyframes cfl{to{transform:translateY(110vh) rotate(720deg)}}.fw{position:fixed;z-index:90;pointer-events:none;font-size:64px;animation:fwp 1.2s forwards}@keyframes fwp{0%{transform:scale(.1);opacity:1}70%{transform:scale(1.6);opacity:1}100%{transform:scale(2);opacity:0}}.cert{border-color:#fbbf24;box-shadow:0 0 40px #f59e0b88,0 0 0 2px #000,inset 0 0 24px #000a;position:relative;overflow:hidden}.cert::before{content:"";position:absolute;inset:-60%;background:repeating-conic-gradient(#fbbf2420 0 10deg,transparent 10deg 20deg);animation:sp 14s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.cert>*{position:relative}.trophy{animation:bn 1s infinite alternate}.rk{font-size:15px;line-height:1.5;margin:4px 0}</style></head><body><button id="bg" class="g" onclick="showBag()" style="display:none">🎒 Beg / <i>Bag</i> <b id="bn">0/4</b></button><button id="hp" class="g" onclick="showHelp()" style="display:none">❓ Bantuan / <i>Help</i></button><button id="mt" class="g" onclick="mute()" title="Bunyi / Sound">🔊</button><div class="w" id="app"></div>
<script>
const C={cy:'#38bdf8',or:'#f59e0b',gr:'#4ade80',rd:'#f87171',ln:'#dbe4ff'};
const P=(c,a,r)=>[c[0]+r*Math.cos(a*Math.PI/180),c[1]-r*Math.sin(a*Math.PI/180)];
const D=(p,q)=>Math.atan2(p[1]-q[1],q[0]-p[0])*180/Math.PI;
const S=b=>`<svg viewBox="0 0 240 160">${b}</svg>`;
const L=(p,q,col=C.ln,d)=>`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="${col}" stroke-width="2.5" ${d?'stroke-dasharray="5 4"':''}/>`;
const Tx=(x,y,t,col=C.ln,s=13)=>`<text x="${x}" y="${y}" fill="${col}" font-size="${s}" font-weight="700" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif">${t}</text>`;
function arcA(c,a1,a2,r,col,lab){const s=P(c,a1,r),e=P(c,a2,r),m=P(c,(a1+a2)/2,r+14);return `<path d="M${s}A${r} ${r} 0 ${a2-a1>180?1:0} 0 ${e}" fill="none" stroke="${col}" stroke-width="3"/>`+(lab?Tx(m[0],m[1],lab,col):'')}
function arcP(c,q1,q2,r,col,lab,big){let a1=(D(c,q1)+360)%360,a2=(D(c,q2)+360)%360,d=(a2-a1+360)%360;if((d>180)!=!!big){a1=a2;d=360-d}return arcA(c,a1,a1+d,r,col,lab)}
const poly=(pts,col=C.gr)=>`<polygon points="${pts.join(' ')}" fill="${col}22" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/>`;
const RA=o=>`<path d="M${o[0]+10} ${o[1]}v-10h-10" fill="none" stroke="${C.ln}" stroke-width="2"/>`;
const tk=(p,q)=>{const m=[(p[0]+q[0])/2,(p[1]+q[1])/2],a=Math.atan2(q[1]-p[1],q[0]-p[0])+Math.PI/2;return L([m[0]-6*Math.cos(a),m[1]-6*Math.sin(a)],[m[0]+6*Math.cos(a),m[1]+6*Math.sin(a)])};
const chev=y=>`<path d="M40 ${y-5}l7 5l-7 5" fill="none" stroke="${C.ln}" stroke-width="2"/>`;
const par=(t,f)=>{const T=[120,50],B=[120-70/Math.tan(t*Math.PI/180),120],u=[Math.cos(t*Math.PI/180),-Math.sin(t*Math.PI/180)];return S(L([20,50],[220,50])+L([20,120],[220,120])+chev(50)+chev(120)+L([T[0]+32*u[0],T[1]+32*u[1]],[B[0]-32*u[0],B[1]-32*u[1]])+f(T,B))};
const rp=(n,c,r)=>Array.from({length:n},(_,k)=>P(c,-90-180/n+k*360/n,r));
const rpx=(n,lab)=>{const c=[100,82],p=rp(n,c,62),v=p[1];return S(poly(p)+L(v,[v[0]+45,v[1]],C.ln,1)+arcA(v,0,360/n,20,C.or,'?')+Tx(205,30,lab,C.or,15))};
const cc=(h,tc,tl,cc2,cl)=>{const c=[120,82],A=P(c,270-h,62),B=P(c,270+h,62),Ap=P(c,90,62);return S(`<circle cx="120" cy="82" r="62" fill="none" stroke="${C.gr}" stroke-width="2.5"/>`+L(Ap,A)+L(Ap,B)+L(c,A,C.or,1)+L(c,B,C.or,1)+arcP(Ap,A,B,18,tc,tl)+arcP(c,A,B,16,cc2,cl)+Tx(c[0],c[1]-10,'O','#fff'))};
const vl=(c,a,t)=>{const p=P(c,a,76);return Tx(p[0],p[1],t,'#fff',12)};
const O1=[110,85],O2=[40,130];
const R=[
{n:"Kunci Pasangan Sudut",t:"Tingkatan 1",h:"Pelengkap a + b = 90° · Penggenap a + b = 180° · Konjugat a + b = 360°. Contoh: 40° → pelengkap 50°, penggenap 140°.",q:[
["Sudut 70° dalam rajah. Cari sudut pelengkap, penggenap dan konjugat.",[["Pelengkap",20],["Penggenap",110],["Konjugat",290]],S(L([20,85],[200,85])+L(O1,P(O1,70,75))+L(O1,P(O1,90,75),C.ln,1)+arcA(O1,0,70,30,C.cy,'70°')+arcA(O1,70,90,42,C.or,'?')+arcA(O1,70,180,52,C.gr,'?')+arcA(O1,70,360,64,C.rd,'?')+Tx(205,20,'pelengkap',C.or)+Tx(205,38,'penggenap',C.gr)+Tx(205,56,'konjugat',C.rd))],
["Sudut 35°. Cari sudut pelengkapnya.",[["Jawapan",55]],S(L(O2,[220,130])+L(O2,[40,20])+L(O2,P(O2,35,170))+RA(O2)+arcA(O2,0,35,50,C.cy,'35°')+arcA(O2,35,90,36,C.or,'?'))],
["Sudut 128°. Cari sudut penggenapnya.",[["Jawapan",52]],S(L([20,120],[220,120])+L([110,120],P([110,120],128,95))+arcA([110,120],0,128,30,C.cy,'128°')+arcA([110,120],128,180,48,C.or,'?'))],
["Sudut 215°. Cari sudut konjugatnya.",[["Jawapan",145]],S(L([30,70],[200,70])+L([110,70],P([110,70],215,85))+arcA([110,70],0,215,26,C.cy,'215°')+arcA([110,70],215,360,48,C.or,'?'))],
["Dua sudut pelengkap ialah x dan 2x. Cari x.",[["x",30]],S(L(O2,[220,130])+L(O2,[40,20])+L(O2,P(O2,30,175))+RA(O2)+arcA(O2,0,30,55,C.gr,'x')+arcA(O2,30,90,38,C.or,'2x'))]]},
{n:"Kunci Garis Selari",t:"Tingkatan 1",h:"F sepadan a = b · Z selang-seli a = b · C pedalaman a + b = 180°. Sudut bertentang bucu sama; sudut bersebelahan pada garis lurus berjumlah 180°.",q:[
["Garis selari, satu sudut 65°. Cari sudut sepadan (F), selang-seli (Z) dan pedalaman (C).",[["F",65],["Z",65],["C",115]],par(65,(T,B)=>arcA(T,180,245,24,C.cy,'65°')+arcA(B,180,245,24,C.or,'F?')+arcA(B,0,65,24,C.gr,'Z?')+arcA(B,65,180,24,C.rd,'C?'))],
["Garis selari: sudut a = 110°. Cari sudut selang-seli b.",[["Jawapan",110]],par(70,(T,B)=>arcA(T,250,360,24,C.cy,'110°')+arcA(B,70,180,24,C.or,'?'))],
["Garis selari: sudut pedalaman a = 118°. Cari sudut pedalaman b.",[["Jawapan",62]],par(62,(T,B)=>arcA(T,242,360,24,C.cy,'118°')+arcA(B,0,62,24,C.or,'?'))],
["Dua garis lurus bersilang, satu sudut 48°. Cari p (bertentang bucu) dan q (bersebelahan).",[["p",48],["q",132]],S(L(P(O1,24,95),P(O1,204,95))+L(P(O1,156,95),P(O1,336,95))+arcA(O1,-24,24,30,C.cy,'48°')+arcA(O1,156,204,30,C.or,'p')+arcA(O1,24,156,22,C.gr,'q'))],
["Garis selari: sudut pedalaman ialah 3x dan 2x. Cari x.",[["x",36]],par(72,(T,B)=>arcA(T,252,360,26,C.or,'3x')+arcA(B,0,72,26,C.gr,'2x'))]]},
{n:"Kunci Segi Tiga dan Sisi Empat",t:"Tingkatan 1",h:"Segi tiga: jumlah 180° · Sisi empat: jumlah 360° · Sudut pedalaman + sudut peluaran = 180° (sudut peluaran = jumlah dua sudut pedalaman bertentangan).",q:[
["Segi tiga: 40°, 75°, x. Sisi empat: 90°, 110°, 80°, y. Cari x dan y.",[["x",65],["y",80]],(()=>{const A=[8,135],B=[98,135],Cc=[82,73],a=[112,135],b=[190,135],c=[219,55],d=[112,60];return S(poly([A,B,Cc])+poly([a,b,c,d],C.cy)+arcP(A,B,Cc,18,C.cy,'40°')+arcP(B,A,Cc,16,C.cy,'75°')+arcP(Cc,A,B,16,C.or,'x')+arcP(a,d,b,16,C.cy,'90°')+arcP(b,a,c,16,C.cy,'110°')+arcP(c,d,b,16,C.cy,'80°')+arcP(d,c,a,16,C.or,'y'))})()],
["Segi tiga mempunyai sudut 52° dan 67°. Cari sudut ketiga.",[["Jawapan",61]],(()=>{const A=[30,135],B=[150,135],Cc=[108,36];return S(poly([A,B,Cc])+arcP(A,B,Cc,22,C.cy,'52°')+arcP(B,A,Cc,22,C.cy,'67°')+arcP(Cc,A,B,18,C.or,'p'))})()],
["Segi tiga sama kaki, sudut puncak 40°. Cari setiap sudut tapak.",[["Jawapan",70]],(()=>{const A=[70,135],B=[150,135],Cc=[110,25];return S(poly([A,B,Cc])+tk(A,Cc)+tk(B,Cc)+arcP(Cc,A,B,20,C.cy,'40°')+arcP(A,B,Cc,22,C.or,'?')+arcP(B,A,Cc,22,C.or,'?'))})()],
["Sisi empat: 85°, 95°, 120° dan q. Cari q.",[["q",60]],(()=>{const a=[60,135],b=[160,135],c=[190,70],d=[75,25];return S(poly([a,b,c,d],C.cy)+arcP(a,d,b,18,C.cy,'85°')+arcP(b,a,c,18,C.cy,'95°')+arcP(c,d,b,16,C.cy,'120°')+arcP(d,c,a,16,C.or,'q'))})()],
["Sudut peluaran segi tiga 125°, satu sudut pedalaman bertentangan 50°. Cari sudut bertentangan yang lain.",[["Jawapan",75]],(()=>{const A=[30,135],B=[130,135],Cc=[85,60],E=[200,135];return S(poly([A,B,Cc])+L(B,E,C.ln,1)+arcP(A,B,Cc,22,C.cy,'50°')+arcP(Cc,A,B,18,C.or,'?')+arcP(B,E,Cc,22,C.gr,'125°'))})()]]},
{n:"Kunci Poligon Sekata",t:"Tingkatan 2",h:"Jumlah pedalaman = (n − 2) × 180° · Pedalaman sekata = (n − 2) × 180° ÷ n · Peluaran sekata = 360° ÷ n.",q:[
["Heksagon sekata (n = 6). Cari jumlah sudut pedalaman dan setiap sudut peluaran.",[["Pedalaman",720],["Peluaran",60]],rpx(6,'n = 6')],
["Cari setiap sudut pedalaman pentagon sekata.",[["Jawapan",108]],(()=>{const p=rp(5,[100,82],62);return S(poly(p)+arcP(p[0],p[4],p[1],18,C.or,'?')+Tx(205,30,'n = 5',C.or,15))})()],
["Cari setiap sudut peluaran oktagon sekata.",[["Jawapan",45]],rpx(8,'n = 8')],
["Setiap sudut peluaran poligon sekata ialah 36°. Cari bilangan sisi.",[["Jawapan",10]],S(L([20,110],[110,110])+L([110,110],P([110,110],36,95))+L([110,110],[210,110],C.ln,1)+arcA([110,110],0,36,34,C.or,'36°')+Tx(190,35,'n = ?',C.or,16))],
["Jumlah sudut pedalaman sebuah poligon ialah 1080°. Cari bilangan sisi.",[["Jawapan",8]],S(`<ellipse cx="120" cy="80" rx="85" ry="58" fill="${C.gr}18" stroke="${C.gr}" stroke-width="2.5" stroke-dasharray="7 5"/>`+Tx(120,68,'1080°',C.ln,20)+Tx(120,96,'n = ?',C.or,18))]]},
{n:"Sudut & Tangen Bulatan",t:"Tingkatan 3",h:"Sudut di pusat = 2 × sudut pada lilitan (lengkok yang sama) · Sisi empat kitaran: sudut bertentangan berjumlah 180° · Sudut peluaran = sudut pedalaman bertentangan.",q:[

const MON=['👻','🎃','🦇','🕷️','🧟','👹'];

const welcome3=()=>`<div class="wl"><div class="wl1"><div class="neon">FAST TRACK ACADEMY</div><h1 class="ttl">MASTER<br>LINE &amp; ANGLE</h1><div class="mu" style="font-size:13px;letter-spacing:2px">ESCAPE ROOM MATEMATIK · TINGKATAN 1 – 3<br><i>MATHS ESCAPE ROOM · FORM 1 – 3</i></div><div class="card" style="text-align:left;line-height:1.55">🕯️ <b class="or">Misi anda:</b> Anda terkunci di dalam makmal geometri purba! Selesaikan teka-teki sudut di <b>5 bilik</b>, kemudian masukkan <b>kod 4 nombor</b> di pintu keluar. Jawapan penting akan disimpan dalam 🎒 beg anda.<div class="en"><b>Your mission:</b> You are locked inside an ancient geometry lab! Solve the angle puzzles in <b>5 rooms</b>, then enter the <b>4-number code</b> at the exit door. Key answers are kept in your 🎒 bag.</div></div><div class="chips"><span class="chip">🔐 Pasangan Sudut<br><i>Angle Pairs</i></span><span class="chip">↔️ Garis Selari<br><i>Parallel Lines</i></span><span class="chip">🔺 Segi Tiga &amp; Sisi Empat<br><i>Triangles &amp; Quadrilaterals</i></span><span class="chip">⬢ Poligon Sekata<br><i>Regular Polygons</i></span><span class="chip">⭕ Bulatan<br><i>Circles</i></span></div></div><div class="wl2">${DOOR}<input id="nm" placeholder="Nama / Name" maxlength="24" style="width:min(260px,90%);text-align:center;margin:8px 0"><br><br><button class="go" onclick="go()">▶ MULA MISI / <i>START MISSION</i></button><div class="mu" style="margin-top:14px;font-size:13px">25 soalan / <i>questions</i> · 5 bilik / <i>rooms</i> · 1 pintu keluar / <i>exit door</i></div><button class="g" onclick="demo()" style="margin-top:12px;font-size:12px">👩‍🏫 Mod Guru: pratonton pintu keluar / <i>Teacher mode: preview exit</i></button></div></div>`;
const rankOf=ms=>ms<600000?['🏆','PELARIAN LEGENDA','LEGENDARY ESCAPEE']:ms<1200000?['🥇','PAKAR SUDUT','ANGLE EXPERT']:['🥈','PENJELAJAH BERANI','BRAVE EXPLORER'];
const EM=['🎉','⭐','✨','∠','△','🔺','🎊','📐'];
function party(){for(let i=0;i<70;i++){const e=document.createElement('div');e.className='cf';e.textContent=EM[i%EM.length];e.style.cssText=`left:${Math.random()*100}vw;font-size:${16+Math.random()*22}px;animation-duration:${2.5+Math.random()*3}s;animation-delay:${Math.random()*1.5}s`;e.onanimationend=()=>e.remove();document.body.appendChild(e)}for(let k=0;k<7;k++)setTimeout(()=>{const e=document.createElement('div');e.className='fw';e.textContent=['🎆','🎇','✨'][k%3];e.style.left=(8+Math.random()*80)+'vw';e.style.top=(8+Math.random()*50)+'vh';e.onanimationend=()=>e.remove();document.body.appendChild(e)},k*450)}
function cleared(){party();sfx('win');const e=document.createElement('div');e.className='cl';e.innerHTML=`<div class="mk">🗝️</div><h2 class="ttl" style="font-size:clamp(26px,5vw,44px)">SEMUA 5 BILIK DITEWASI!<br><i style="font-size:.5em;letter-spacing:1px">ALL 5 ROOMS CLEARED!</i></h2><div class="keyz">${[1,2,3,4,5].map(n=>`<span style="animation-delay:${.4+n*.35}s">🔓</span>`).join('')}</div><div class="mu">🎒 Kod rahsia sudah ada dalam beg anda!<br><i>The secret code is now in your bag!</i></div><button class="go" style="margin-top:12px" onclick="initAudio();this.closest('.cl').remove();doorOpen(5)">🚪 Ke pintu keluar / <i>To the exit door</i></button>`;document.body.appendChild(e)}
async function enterCode(){initAudio();const b=$("#od");for(let i=0;i<4;i++){const x=$("#c"+i);x.style.borderColor='#4ade80';x.style.boxShadow='0 0 14px #4ade80';x.value='';await wait(380);x.value=BAG[i]??'';sfx('tick')}if(b)b.classList.add('go')}
function demo(){R.forEach((r,ri)=>r.q.forEach((_,qi)=>done[ri+"-"+qi]=1));[65,80,60,70].forEach((v,i)=>BAG[i]=v);pname=pname||'Guru';started=true;room=5;start=Date.now()-540000;render();cleared()}
const CODE=[65,80,60,70];
let room=0,done={},hint={},start=Date.now(),fin=null,started=false,pname="";
const $=s=>document.querySelector(s);
const total=()=>Object.keys(done).length;
const fmt=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
const roomDone=r=>R[r].q.every((_,i)=>done[r+"-"+i]);
function render(){$("#hp").style.display=started&&room<5?'':'none';$("#bg").style.display=started?'':'none';updBag();if(!started){$("#app").innerHTML=welcome3();return}
let h=`<div class="bar"><div><h1>🔦 Escape Room: Master Line &amp; Angle</h1><div class="mu">Selesaikan 5 bilik dan cari kod pintu keluar<br><i>Solve 5 rooms and find the exit code</i></div></div><div class="tm" id="tm">${fmt((fin||Date.now())-start)}</div></div>
<div class="doors">${R.map((r,i)=>`<div class="d ${i==room?'on':''} ${roomDone(i)?'ok':''}">${roomDone(i)?'🔓':'🔒'}<br>Bilik ${i+1}<br><i>Room ${i+1}</i></div>`).join("")}<div class="d ${room==5?'on':''} ${fin?'ok':''}">🚪<br>Keluar<br><i>Exit</i></div></div>`;
if(room<5){
const r=R[room];
h+=`<h2>Bilik ${room+1}/5 · ${r.n}<br><i class="mu" style="font-size:16px">Room ${room+1}/5 · ${EN[room].n}</i></h2><div class="mu">${r.t} / <i>${r.t.replace('Tingkatan','Form')}</i> · ${r.q.filter((_,i)=>done[room+"-"+i]).length}/5 soalan selesai / <i>questions solved</i></div>
<button class="g" onclick="showHelp()" style="margin-top:10px">❓ Bantuan / <i>Help</i> — Nota / <i>Notes</i></button>`;
h+='<div class="qs">';r.q.forEach((q,i)=>{const k=room+"-"+i,ok=done[k];
h+=`<div class="card ${ok?'ok':''}"><div class="row"><div><b class="or">${i+1}.</b> ${q[0]}<div class="en">${EN[room].q[i]}</div>
${q[1].map((f,j)=>`<div class="f"><label>${f[0]}${ENL[f[0]]?' / <i>'+ENL[f[0]]+'</i>':''} =</label><input type="number" inputmode="decimal" id="i${i}_${j}" ${ok?'disabled value="'+f[1]+'"':''}> °</div>`).join("")}
<button onclick="chk(${i})" ${ok?'disabled':''}>${ok?'✔ Betul / <i>Correct</i>':'Semak / <i>Check</i>'}</button><div class="msg" id="m${i}"></div></div><div class="dg">${q[2]}</div></div></div>`});
h+='</div>';if(roomDone(room))h+=`<div class="card c ok"><div class="big">🔓</div><b>Pintu bilik ${room+1} terbuka! / <i>Room ${room+1} door unlocked!</i></b><br><br><button onclick="${room==4?'cleared()':'doorOpen('+(room+1)+')'}">${room==4?'Ke pintu keluar / <i>To the exit</i> ➜':'Bilik seterusnya / <i>Next room</i> ➜'}</button></div>`;
}else if(!fin){
h+=`<h2>🚪 Pintu Keluar / <i>Exit Door</i></h2><div class="mu">Salin jawapan Soalan 1 daripada bilik yang ditunjukkan. Nombor sahaja, tanpa °.<br><i>Copy your answer to Question 1 from the room shown. Number only, without °.</i></div>
<div class="card"><div class="codes">${["B3 S1: x<br><i>R3 Q1</i>","B3 S1: y<br><i>R3 Q1</i>","B4 S1: peluaran<br><i>R4 Q1 exterior</i>","B5 S1: pusat<br><i>R5 Q1 centre</i>"].map((l,i)=>`<div class="c"><div class="mu" style="font-size:13px;margin-bottom:4px">${l}</div><div class="bagv">🎒 ${BAG[i]??'?'}</div><input type="number" id="c${i}"></div>`).join("")}</div>
<div class="c"><button class="g" onclick="enterCode()">🔢 Masuk kod / <i>Enter code</i></button> <button id="od" onclick="chkExit()">Buka pintu / <i>Open door</i></button><div class="msg" id="me"></div></div></div>`;
}else{
const t=total(),rk=rankOf(fin-start);
h+=`<div class="card c ok cert"><div class="big trophy">${rk[0]}</div><div class="rk">⭐⭐⭐<br><b class="or">${rk[1]}</b><br><i>${rk[2]}</i></div><h2>Tahniah${pname?' '+pname:''}! Anda berjaya melarikan diri!<br><i class="mu" style="font-size:16px">Congratulations${pname?' '+pname:''}! You escaped!</i></h2><p>Masa / <i>Time</i>: <b class="or">${fmt(fin-start)}</b> · Markah / <i>Score</i>: <b class="or">${t} / 25</b></p>
<p class="mu">${t==25?'Sempurna! Anda Master Line &amp; Angle.<br><i>Perfect! You are a Master of Line &amp; Angle.</i>':'Bagus! Ulang kaji nota bilik untuk markah penuh.<br><i>Well done! Review the room notes for full marks.</i>'}</p><button onclick="location.reload()">Main semula / <i>Play again</i></button></div>`;}
$("#app").innerHTML=h;}
function chk(i){
const q=R[room].q[i];
if(q[1].every((f,j)=>parseFloat($("#i"+i+"_"+j).value)===f[1])){done[room+"-"+i]=1;sfx('ok');bagAdd(room,i);render()}
else{const m=$("#m"+i);m.style.color="var(--rd)";sfx('bad');scare();m.innerHTML="Belum tepat. Cuba lagi, lihat nota bilik jika perlu.<br><i>Not quite. Try again, check the room notes if needed.</i>"}}
function chkExit(){
if(CODE.every((c,i)=>parseFloat($("#c"+i).value)===c)){fin=Date.now();doorOpen(6)}
else{const m=$("#me");m.style.color="var(--rd)";sfx('bad');scare();m.innerHTML="Kod salah. Semak semula jawapan Soalan 1 Bilik 3, 4 dan 5.<br><i>Wrong code. Recheck your Question 1 answers in Rooms 3, 4 and 5.</i>"}}
setInterval(()=>{const e=$("#tm");if(e&&!fin)e.textContent=fmt(Date.now()-start)},1000);
render();if(location.hash=='#demo')demo();addEventListener('hashchange',()=>{if(location.hash=='#demo')demo()});
</script></body></html>
